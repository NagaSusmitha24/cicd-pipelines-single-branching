name: Deploy to Dev
on: 

  pull_request: 

    branches: 

      - dev   

  workflow_dispatch: 

    inputs: 

      environment: 

        description: Environment to deploy to 

        type: choice 

        options: 

          - dev 

          - qa  

          - prod 

        default: dev        

  

jobs: 

  pipeline: 

    uses: NagaSusmitha24/common-pipeline/.github/workflows/mulesoft-sapi-ci-cd.yml@main 

    with: 

      environment: ${{ inputs.environment || 'dev' }} 

    secrets: inherit
