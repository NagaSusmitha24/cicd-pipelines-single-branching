name: Deploy to Dev

on:
  pull_request:
    types: [closed]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    uses: NagaSusmitha24/common-pipeline/.github/workflows/mulesoft-sapi-ci-cd.yml@main
    with:
      environment: dev
    secrets: inherit
